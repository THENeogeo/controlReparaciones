spring.application.name=controlReparaciones
# Configuraci\u00f3n de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:4202/control_de_reparaciones
spring.datasource.username=postgres
spring.datasource.password=admin

#spring.datasource.url=jdbc:postgresql://localhost:5432/control_de_reparaciones
#spring.datasource.username=postgres
#spring.datasource.password=admin

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Esa l\u00ednea decide cu\u00e1ndo se cierra la conexi\u00f3n con la base de datos.
# true: la conexi\u00f3n se queda abierta hasta que termina toda la petici\u00f3n (incluyendo la vista)
# false: la conexi\u00f3n se cierra antes, justo cuando termina la l\u00f3gica del backend
spring.jpa.open-in-view=false 

# Configuraci\u00f3n de Swagger
#springdoc.api-docs.path=/api-docs
#springdoc.swagger-ui.path=/swagger-ui.html

#spring.jackson.serialization.fail-on-empty-beans=false

spring.security.user.name=admin
spring.security.user.password=admin
